name: Oracle Finance China filing monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: oracle-finance-china-filing-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect China disclosures and build RSS feed
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python china_monitor.py

      - name: Publish updated China RSS and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/oracle-china-filings.xml data/china_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Oracle Finance China filings feed"
            git push origin HEAD:main
          else
            echo "No changes to publish."
          fi
