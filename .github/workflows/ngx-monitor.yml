name: Oracle Finance NGX disclosure monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: oracle-finance-ngx-disclosure-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect NGX corporate disclosures and build RSS feed
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python ngx_monitor.py

      - name: Publish updated NGX RSS and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/oracle-ngx-filings.xml data/ngx_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Oracle Finance NGX disclosures feed"
            git push origin HEAD:main
          else
            echo "No changes to publish."
          fi
